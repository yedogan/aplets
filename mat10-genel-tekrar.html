<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10. Sınıf Matematik, 1. Dönem 1. Yazılı Sınav - Genel Tekrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Matematik 10 Genel Tekrar — Senaryo 4 ve 5 (MAT.10.1.1–10.1.4), Türkçe/İngilizce.
   Renkler: lacivert mürekkep, kâğıt zemin; karşı dik kenar turuncu, komşu dik kenar mavi. */
:root{
  --bg:#f3f1ea; --panel:#ffffff; --paper:#fcfbf7; --ink:#1b2333; --ink2:#535d71; --line:#d9d4c6; --soft:#ece8dc; --grid:#ebe7dc;
  --accent:#2b3f86; --accent2:#3a77c2; --accent-ink:#ffffff;
  --ok:#16704f; --okbg:#def2e8; --bad:#b9321f; --badbg:#fbe5df; --warn:#8f5a00; --warnbg:#fdf0d4;
  --opp:#d2611a; --adj:#2f6fc0; --hyp:#1b2333; --c1:#8a3fb8; --c2:#0f8a7a; --c3:#c2410c; --fill:rgba(58,119,194,.08);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --panel:#171d28; --paper:#131925; --ink:#e8ebf2; --ink2:#a2abbe; --line:#2c3446; --soft:#202838; --grid:#1d2433;
  --accent:#a3b6f5; --accent2:#7fb2ee; --accent-ink:#10141c;
  --ok:#5fd2a4; --okbg:#12332a; --bad:#ff8a74; --badbg:#3a1c17; --warn:#f1b552; --warnbg:#382a10;
  --opp:#ff9a52; --adj:#6fa9ef; --hyp:#e8ebf2; --c1:#c690ee; --c2:#4fd1bd; --c3:#ff8f5a; --fill:rgba(127,178,238,.10); color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:16px 48px}
.wrap{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{background:#fff;border-radius:10px;padding:6px 10px;display:flex;align-items:center}
.logo img{height:40px;width:auto;display:block}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,3.6vw,2.2rem);letter-spacing:-.02em;margin:0;line-height:1.05;text-wrap:balance}
h1 .h1b{display:block;font-size:.55em;font-weight:600;color:var(--ink2);margin-top:4px;letter-spacing:0}
.sub{margin:4px 0 0;color:var(--ink2);max-width:66ch;font-size:.95rem}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lang{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.lang button{border:0;background:none;color:var(--ink);font:inherit;font-weight:700;font-size:.9rem;padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.total{font-family:var(--f-mono);font-size:.85rem;color:var(--ink2);display:flex;align-items:center;gap:10px}
.total .bar{width:140px;height:10px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.total .bar i{display:block;height:100%;background:var(--ok);width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab small{font-family:var(--f-mono);font-weight:500;font-size:.75rem;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.8}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.hidden{display:none!important}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
h2{font-family:var(--f-display);font-size:1.2rem;margin:0 0 6px;letter-spacing:-.01em}
h3{font-family:var(--f-display);font-size:1.02rem;margin:0 0 6px}
.lead{margin:0 0 10px;color:var(--ink2);font-size:.95rem}
.kod{font-family:var(--f-mono);font-size:.75rem;color:var(--ink2);background:var(--soft);padding:2px 7px;border-radius:6px}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:.88rem}
.btn.danger{border-color:var(--bad);background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:.86rem;padding:5px 10px;border-radius:999px;cursor:pointer}
.chip:hover:not(:disabled){border-color:var(--accent2)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:disabled{opacity:.5;cursor:default}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.ctl{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.ctl label{font-size:.88rem;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.ctl label output{font-family:var(--f-mono);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent2);height:28px}
input[type=text],select{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px}
input.numin{width:110px;font-family:var(--f-mono)}
svg{display:block;max-width:100%;height:auto}
.stage{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.stage text{font-family:var(--f-body)}
.stage .mono{font-family:var(--f-mono)}
.handle{cursor:grab}
.handle:active{cursor:grabbing}
table.rd{border-collapse:collapse;width:100%;font-size:.9rem;margin-top:8px}
table.rd th,table.rd td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.rd td.n{font-family:var(--f-mono);font-size:.85rem;text-align:right;white-space:nowrap}
table.rd th{color:var(--ink2);font-weight:700;font-size:.82rem}
.pill{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--ink)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
.task.done{border-color:var(--ok);background:var(--okbg)}
.task .head{display:flex;gap:8px;align-items:flex-start}
.task .num{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;background:var(--soft);color:var(--ink2)}
.task.done .num{background:var(--ok);color:var(--panel)}
.task p{margin:0}
.task .body{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:.93rem;padding:7px 10px;border-radius:9px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent2)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.opt.placed{opacity:.35}
.fb{font-size:.9rem;padding:8px 10px;border-radius:9px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.info{background:var(--warnbg);color:var(--warn)}
.status{font-size:.88rem;color:var(--ink2);font-style:italic}
.status.okc{color:var(--ok);font-style:normal;font-weight:700}
.hint{font-size:.86rem;color:var(--ink2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.olist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.olist li.okl{color:var(--ok)}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.st{display:flex;flex-direction:column;gap:6px}
.st .ring{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.82rem;color:var(--ink2)}
.st .ring .bar{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.st .ring .bar i{display:block;height:100%;background:var(--ok)}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
table.sen{border-collapse:collapse;width:100%;font-size:.9rem}
table.sen th,table.sen td{border:1px solid var(--line);padding:6px 8px;text-align:left}
table.sen td.c{text-align:center;font-family:var(--f-mono)}table.sen th.c{text-align:center}
table.sen th{background:var(--soft)}
table.sen .hl{background:var(--warnbg);font-weight:700}
.fill{border-collapse:collapse;margin:6px 0}
.fill th,.fill td{border:1px solid var(--line);padding:5px 7px;text-align:center}
.fill th{background:var(--soft);font-family:var(--f-mono);font-size:.85rem}
.fill select{padding:4px;font-size:.92rem}
.fill select.right{border-color:var(--ok);background:var(--okbg)}
.fill select.wrong{border-color:var(--bad);background:var(--badbg)}
.qcard{display:flex;flex-direction:column;gap:8px}
.mono{font-family:var(--f-mono);font-size:.82rem;color:var(--ink2)}
.conf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--ink2)}
.kbar{display:grid;grid-template-columns:minmax(120px,220px) 1fr auto;gap:10px;align-items:center;font-size:.9rem;margin:4px 0}
.kbar .bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.kbar .bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--ink2);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--c)}
footer{color:var(--ink2);font-size:.82rem;padding-top:8px}
</style>
</head>

<script>
(function(){
"use strict";
/* ================= yardımcılar ================= */
const $=s=>document.querySelector(s);
const el=(tag,attrs,...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v===false||v==null)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e};
const NS='http://www.w3.org/2000/svg';
const sv=(tag,attrs,txt)=>{const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs||{}))e.setAttribute(k,v);if(txt!=null)e.textContent=txt;return e};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const RAD=Math.PI/180;

/* ================= kayıt ve dil ================= */
const KEY='mat10-genel-tekrar-v1';
let S={done:{},karma:null,check:{},sen:null,lang:null};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let LANG='tr';
try{const q=new URLSearchParams(location.search).get('lang');if(q==='en'||q==='tr')LANG=q;else if(S.lang==='en'||S.lang==='tr')LANG=S.lang}catch(e){}
const L=(tr,en)=>({tr,en});
const tx=v=>(v&&typeof v==='object'&&!Array.isArray(v)&&('tr' in v))?v[LANG]:(v==null?'':v);
const nf=(x,d=2)=>{if(!isFinite(x))return '—';const r=Math.round(x*10**d)/10**d;return (Object.is(r,-0)?0:r).toLocaleString(LANG==='tr'?'tr-TR':'en-GB',{minimumFractionDigits:0,maximumFractionDigits:d})};
const nfx=(x,d)=>{const r=Math.round(x*10**d)/10**d;return (Object.is(r,-0)?0:r).toLocaleString(LANG==='tr'?'tr-TR':'en-GB',{minimumFractionDigits:d,maximumFractionDigits:d})};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}updateProgress()};
/* anonim kullanım sayacı (GoatCounter; kişisel veri yok) */
const GC=ev=>{try{const g=window.goatcounter;if(g&&g.count)g.count({path:'mat10/'+LANG+'/'+ev,title:ev,event:true})}catch(e){}};
const markDone=id=>{if(!S.done[id]){S.done[id]=true;save();GC('gorev/'+id)}};

const UI={
  h1a:L('10. Sınıf Matematik','Grade 10 Mathematics'),
  h1b:L('1. Dönem 1. Yazılı Sınav - Genel Tekrar','Term 1, Exam 1 - Review'),
  title:L('10. Sınıf Matematik, 1. Dönem 1. Yazılı Sınav - Genel Tekrar','Grade 10 Mathematics, Term 1 Exam 1 - Review'),
  sub:L('Senaryo 4 ve Senaryo 5 · Geometrik Şekiller teması. Her istasyonda önce tahmin et, sonra şekli değiştirerek dene, karar ver ve gerekçeni seç.','Scenarios 4 and 5 · Theme: Geometric Shapes. At each station, predict first, then test by changing the figure, decide, and choose your reason.'),
  foot:L('Hazırlayan: Yunus Emre Doğan · Özel Sevil Ünal Doğan Sosyal Etkinlik ve Gelişim Merkezi · İlerleme yalnızca bu tarayıcıda saklanır. Kaynak: MEB Ortaöğretim Matematik Dersi Öğretim Programı ve 10. sınıf 1. dönem ortak yazılı konu soru dağılım tablosu.','Prepared by Yunus Emre Doğan · Özel Sevil Ünal Doğan Sosyal Etkinlik ve Gelişim Merkezi · Progress is stored only in this browser. Source: MEB secondary mathematics curriculum and the Grade 10 Term 1 common-exam question distribution table.'),
  tasks:L('görev','tasks'),
  right:L('Doğru.','Correct.'), again:L('Tekrar düşün.','Think again.'), wrong:L('Yanlış.','Not quite.'),
  hintSim:L('Simülasyona dönüp dene.','Go back to the simulation and test it.'),
  tryTxt:L('Simülasyonda dene; koşul sağlanınca burada görünecek.','Try it in the simulation; this unlocks when the condition is met.'),
  found:L('Buldun!','Found it!'), doneTxt:L('Tamamlandı.','Completed.'),
  answer:L('Yanıtla','Check'), showSol:L('Çözümü gör','Show solution'), yourAns:L('Yanıtın','Your answer'),
  numHint:L('Ondalık yanıtta virgül ya da nokta kullanabilirsin; kesir de yazabilirsin (ör. 3/4).','You may use a decimal point or comma, or a fraction (e.g. 3/4).'),
  orderHint:L('Adımlara doğru sırayla tıkla.','Tap the steps in the correct order.'),
  notYet:L('Bu adım henüz değil.','Not this step yet.'),
  tasksH:L('Görevler','Tasks'),
};

/* ================= istasyonlar ================= */
const STATIONS=[
  {id:'harita',ad:L('Harita','Map'),kod:''},
  {id:'oran',ad:L('Trigonometrik Oranlar','Trigonometric Ratios'),kod:'MAT.10.1.1'},
  {id:'yard',ad:L('Yardımcı Elemanlar','Special Lines & Centres'),kod:'MAT.10.1.2'},
  {id:'alan',ad:L('Üçgenin Alanı','Area of a Triangle'),kod:'MAT.10.1.3'},
  {id:'teo',ad:L('Sinüs ve Kosinüs Teoremleri','Sine & Cosine Theorems'),kod:'MAT.10.1.4'},
  {id:'karma',ad:L('Karma Tur','Mixed Round'),kod:L('Hepsi','All')},
];
const TASKS={};const regTask=(st,id)=>{(TASKS[st]=TASKS[st]||[]);if(!TASKS[st].includes(id))TASKS[st].push(id)};
const CHECKS={};const U={};
function runChecks(st){(CHECKS[st]||[]).forEach(c=>{if(!U[c.id]&&c.test()){U[c.id]=true;c.onPass()}})}

const tabsEl=$('#tabs'),viewsEl=$('#views');const views={};
let current='harita';
try{const t=sessionStorage.getItem(KEY+'-tab');if(t&&STATIONS.some(s=>s.id===t))current=t}catch(e){}
function buildTabs(){
  tabsEl.innerHTML='';tabsEl.setAttribute('aria-label',tx(L('İstasyonlar','Stations')));
  STATIONS.forEach(s=>{
    tabsEl.append(el('button',{class:'tab',role:'tab','aria-selected':String(s.id===current),'aria-controls':'v-'+s.id,id:'t-'+s.id,onclick:()=>show(s.id)},tx(s.ad),el('small',{id:'tc-'+s.id},'')));
    if(!views[s.id]){const v=el('section',{id:'v-'+s.id,role:'tabpanel','aria-labelledby':'t-'+s.id});viewsEl.append(v);views[s.id]=v}
    views[s.id].classList.toggle('hidden',s.id!==current);
  });
}
function show(id){
  current=id;
  STATIONS.forEach(s=>{$('#t-'+s.id).setAttribute('aria-selected',String(s.id===id));views[s.id].classList.toggle('hidden',s.id!==id)});
  try{sessionStorage.setItem(KEY+'-tab',id)}catch(e){}
  if(id==='harita')build_harita(views.harita);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ================= görev bileşenleri ================= */
function taskBox(st,id,n,text){
  regTask(st,id);
  const box=el('div',{class:'task'+(S.done[id]?' done':'')});
  box.append(el('div',{class:'head'},el('span',{class:'num'},String(n)),el('p',{html:tx(text)})));
  const body=el('div',{class:'body'});box.append(body);
  return {box,body,finish:()=>{box.classList.add('done');markDone(id)}};
}
/* opts[0] doğru seçenektir; gösterirken karıştırılır */
function mcBlock(g,onRight){
  const wrap=el('div',{class:'body'});
  if(g.q)wrap.append(el('p',{html:'<b>'+tx(g.q)+'</b>'}));
  const order=shuffle(g.opts.map((o,i)=>i));
  const fb=el('div',{class:'fb hidden'});
  const btns=order.map(i=>el('button',{class:'opt',type:'button',onclick:()=>{
    const b=btns[order.indexOf(i)];
    if(i===0){btns.forEach(x=>x.disabled=true);b.classList.add('right');fb.className='fb ok';fb.innerHTML='<b>'+tx(UI.right)+'</b> '+tx(g.expl||'');onRight&&onRight()}
    else{b.classList.add('wrong');b.disabled=true;fb.className='fb bad';fb.innerHTML='<b>'+tx(UI.again)+'</b> '+tx(g.hint||UI.hintSim)}
  },html:tx(g.opts[i])}));
  wrap.append(...btns,fb);return wrap;
}
function MC(st,id,n,g){const t=taskBox(st,id,n,g.q);t.body.append(mcBlock({opts:g.opts,expl:g.expl,hint:g.hint},t.finish));return t.box}
const parseNum=s=>{s=String(s).trim().replace(/\s/g,'').replace(',','.');if(!s)return NaN;if(s.includes('/')){const[p,q]=s.split('/');return Number(p)/Number(q)}return Number(s)};
function numBlock(g,onRight){
  const wrap=el('div',{class:'body'});
  const inp=el('input',{type:'text',inputmode:'decimal',class:'numin','aria-label':tx(UI.yourAns)});
  const fb=el('div',{class:'fb hidden'});let tries=0;
  const sol=el('button',{class:'btn ghost sm hidden',type:'button',onclick:()=>{fb.className='fb info';fb.innerHTML=tx(g.expl);sol.classList.add('hidden')}},tx(UI.showSol));
  const go=()=>{const v=parseNum(inp.value);if(!isFinite(v))return;
    if(Math.abs(v-g.ans)<=(g.tol??0.01)+1e-9){inp.style.borderColor='var(--ok)';inp.disabled=true;b.disabled=true;sol.classList.add('hidden');fb.className='fb ok';fb.innerHTML='<b>'+tx(UI.right)+'</b> '+tx(g.expl);onRight&&onRight()}
    else{tries++;inp.style.borderColor='var(--bad)';fb.className='fb bad';fb.innerHTML='<b>'+tx(UI.again)+'</b> '+tx(g.hint||'');if(tries>=2)sol.classList.remove('hidden')}};
  const b=el('button',{class:'btn sm',type:'button',onclick:go},tx(UI.answer));
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  wrap.append(el('div',{class:'row'},inp,g.unit?el('span',{},tx(g.unit)):null,b,sol),el('p',{class:'hint'},tx(UI.numHint)),fb);

      expl:L('(karşı/hip)² + (komşu/hip)² = (karşı² + komşu²)/hip² = 1 (Pisagor).','(opp/hyp)² + (adj/hyp)² = (opp² + adj²)/hyp² = 1 (Pythagoras).')}),

const T2={pts:{A:P(180,80),B:P(80,340),C:P(460,340)},mode:'bis',bisShapes:[],medMoves:0,incSeen:false};
function build_yard(v){
  v.innerHTML='';CHECKS.yard=[];
  const read=el('div');
  const MODES=[['bis',L('İç açıortay (A)','Angle bisector (A)')],['med',L('Kenarortaylar','Medians')],['perp',L('Kenar orta dikmeler','Perpendicular bisectors')],['alt',L('Yükseklikler','Altitudes')],['inc',L('İç açıortaylar','All angle bisectors')]];

  function draw(g,pts){
    const{A,B,C}=pts;const t=sides(pts);

    if(T2.mode==='bis'){
      const D=P((t.b*B.x+t.c*C.x)/(t.b+t.c),(t.b*B.y+t.c*C.y)/(t.b+t.c));
      line(g,B,D,'var(--opp)',5);line(g,D,C,'var(--adj)',5);line(g,A,D,'var(--c1)',2.5);
      angleArcAt(g,A,B,D,30,'var(--c1)');angleArcAt(g,A,D,C,36,'var(--c1)');
      dotp(g,D,'var(--c1)');label(g,P(D.x,D.y+18),'D',{bold:true});
      row('|AB| = c',u(dist(A,B)));row('|AC| = b',u(dist(A,C)));row('<span style="color:var(--opp)">|BD|</span>',u(dist(B,D)));row('<span style="color:var(--adj)">|DC|</span>',u(dist(D,C)));
      row('<b>|AB| / |AC|</b>','<b>'+nfx(t.c/t.b,3)+'</b>');row('<b>|BD| / |DC|</b>','<b>'+nfx(dist(B,D)/dist(D,C),3)+'</b>');
      read.append(el('p',{class:'hint',style:'margin:6px 0 0'},tx(L('[AD], A açısını iki eş parçaya bölüyor.','[AD] cuts angle A into two equal parts.'))));
    }else if(T2.mode==='med'){
      const D=mid(B,C),E=mid(C,A),F=mid(A,B),G=P((A.x+B.x+C.x)/3,(A.y+B.y+C.y)/3);
      line(g,A,D,'var(--c2)',2.5);line(g,B,E,'var(--c2)',2.5);line(g,C,F,'var(--c2)',2.5);
      line(g,A,G,'var(--opp)',5);line(g,G,D,'var(--adj)',5);
      [[D,'D'],[E,'E'],[F,'F']].forEach(([p,n])=>{dotp(g,p,'var(--c2)',4);const d=sub(p,G);const k=1/(len(d)||1);label(g,add(p,mul(d,16*k)),n,{bold:true,size:14})});
      dotp(g,G,'var(--c3)',6);label(g,P(G.x+14,G.y-12),'G',{bold:true});
      row('<span style="color:var(--opp)">|AG|</span>',u(dist(A,G)));row('<span style="color:var(--adj)">|GD|</span>',u(dist(G,D)));row('<b>|AG| / |GD|</b>','<b>'+nfx(dist(A,G)/dist(G,D),3)+'</b>');
      row('|BG| / |GE|',nfx(dist(B,G)/dist(G,E),3));row('|CG| / |GF|',nfx(dist(C,G)/dist(G,F),3));
      read.append(el('p',{class:'hint',style:'margin:6px 0 0'},tx(L('D, E, F kenarların orta noktaları; G kenarortayların kesiştiği nokta (ağırlık merkezi).','D, E, F are the midpoints of the sides; G is where the medians meet (centroid).'))));
    }else if(T2.mode==='perp'){
      const O=circum(A,B,C),R=dist(O,A);

      [[B,C],[C,A],[A,B]].forEach(([p,q])=>{const m=mid(p,q),d=sub(q,p);const n=P(-d.y,d.x);fullLine(g,m,add(m,n),'var(--c2)',1.6);rightMark(g,m,q,add(m,n),9,'var(--c2)');dotp(g,m,'var(--c2)',3.5)});
      dotp(g,O,'var(--c3)',6);label(g,P(O.x+14,O.y-12),'O',{bold:true});
      row('|OA|',u(dist(O,A)));row('|OB|',u(dist(O,B)));row('|OC|',u(dist(O,C)));
      const where=typ==='dik'?L('O hipotenüsün üzerinde (orta noktası).','O lies on the hypotenuse (its midpoint).'):typ==='genis'?L('O üçgenin dışında.','O is outside the triangle.'):L('O üçgenin içinde.','O is inside the triangle.');
      read.append(el('p',{class:'hint',style:'margin:6px 0 0',html:tx(L('Kenar orta dikmeler O’da kesişir; O çevrel çemberin merkezidir. ','The perpendicular bisectors meet at O, the centre of the circumcircle. '))+'<b>'+tx(where)+'</b>'}));
      if(typ==='dik'){const big=t.A>89?'A':t.B>89?'B':'C';const V=pts[big];const hyp=['A','B','C'].filter(x=>x!==big);const M=mid(pts[hyp[0]],pts[hyp[1]]);line(g,V,M,'var(--opp)',3);row(tx(L('Hipotenüse ait kenarortay','Median to the hypotenuse')),u(dist(V,M)));row(tx(L('Hipotenüsün yarısı','Half the hypotenuse')),u(dist(pts[hyp[0]],pts[hyp[1]])/2))}

        line(g,V,f.p,'var(--c3)',2.5);if(dist(V,f.p)>14)rightMark(g,f.p,V,f.t>0.5?p:q,9,'var(--c3)');
        const inside=s=>s>=-1e-6&&s<=1+1e-6;const fh=foot(H,V,f.p);if(!inside(fh.t))line(g,fh.t<0?V:f.p,H,'var(--c3)',1.4,'3 5')});
      if(H.x>-200&&H.x<760&&H.y>-200&&H.y<600){dotp(g,H,'var(--c1)',6);label(g,P(H.x+14,H.y-12),'H',{bold:true})}
      const where=typ==='dik'?L('H dik açılı köşede.','H is at the right-angle vertex.'):typ==='genis'?L('H üçgenin dışında.','H is outside the triangle.'):L('H üçgenin içinde.','H is inside the triangle.');
      read.append(el('p',{class:'hint',style:'margin:6px 0 0',html:tx(L('Yükseklikler (ya da uzantıları) H’de kesişir; H diklik merkezidir. ','The altitudes (or their extensions) meet at H, the orthocentre. '))+'<b>'+tx(where)+'</b>'}));
      row('h<sub>a</sub>',u(foot(A,B,C).p&&dist(A,foot(A,B,C).p)));row('h<sub>b</sub>',u(dist(B,foot(B,C,A).p)));row('h<sub>c</sub>',u(dist(C,foot(C,A,B).p)));
    }else if(T2.mode==='inc'){
      const per=t.a+t.b+t.c;const I=P((t.a*A.x+t.b*B.x+t.c*C.x)/per,(t.a*A.y+t.b*B.y+t.c*C.y)/per);const r=2*area2(A,B,C)/(per*UNIT);
      [[A,B,C,t.c,t.b],[B,C,A,t.a,t.c],[C,A,B,t.b,t.a]].forEach(([V,p,q,cp,cq])=>{const D=P((cq*p.x+cp*q.x)/(cp+cq),(cq*p.y+cp*q.y)/(cp+cq));line(g,V,D,'var(--c1)',2)});

      test:()=>T2.medMoves>=2,follow:{q:L('G noktası kenarortayı hangi oranda böler?','In what ratio does G divide a median?'),opts:['|AG| : |GD| = 2 : 1','|AG| : |GD| = 1 : 1','|AG| : |GD| = 3 : 1','|AG| : |GD| = 1 : 2'],
      expl:L('Ağırlık merkezi her kenarortayı köşeden itibaren 2 : 1 oranında böler.','The centroid divides each median in the ratio 2 : 1, measured from the vertex.')}}),
    CHK('yard','y-alt',3,{q:L('<b>Yükseklikler</b> modunda diklik merkezi H’yi üçgenin <b>dışına</b> çıkar.','In <b>Altitudes</b> mode, move the orthocentre H <b>outside</b> the triangle.'),
      test:()=>T2.mode==='alt'&&triType(sides(T2.pts))==='genis',follow:{q:L('H ne zaman üçgenin dışında olur?','When is H outside the triangle?'),

    CHK('yard','y-dik',4,{q:L('<b>Kenar orta dikmeler</b> modunda bir <b>dik üçgen</b> oluştur (bir açı 90° olsun).','In <b>Perpendicular bisectors</b> mode, make a <b>right triangle</b> (one angle 90°).'),
      test:()=>T2.mode==='perp'&&triType(sides(T2.pts))==='dik',follow:{q:L('Dik üçgende çevrel çemberin merkezi O nerededir?','Where is the circumcentre O of a right triangle?'),

    el('p',{class:'lead'},tx(L('Bütün istasyonlardan karışık sorular. Senaryo provaları sınavdaki konu dağılımını izler. Her sorudan önce ne kadar emin olduğunu seç: önce emin olup yanlış yaptığın konuları çalış.','Mixed questions from every station. The scenario rehearsals follow the exam’s topic distribution. Before each question choose how sure you are: study first what you got wrong while feeling sure.'))),area));
  let Q=[],qi=0,res=[];
  const start=()=>{Q=[];for(const[k,n]of Object.entries(PLANS[plan]))Q.push(...shuffle(BANK.filter(b=>b[0]===k)).slice(0,n));qi=0;res=[];ask()};
  const intro=()=>{area.innerHTML='';
    area.append(segChips(Object.keys(PL).map(k=>[k,PL[k]]),plan,k=>{plan=k}));
    if(S.karma)area.append(el('p',{class:'hint'},tx(L(`Son turun: ${S.karma.score} / ${S.karma.total}.`,`Your last round: ${S.karma.score} / ${S.karma.total}.`))));
    area.append(el('button',{class:'btn',type:'button',onclick:start},tx(S.karma?L('Yeni tur başlat','Start a new round'):L('Turu başlat','Start the round'))))};
  const ask=()=>{area.innerHTML='';const q=Q[qi];let conf=null;
    const confRow=el('div',{class:'conf'},tx(L('Ne kadar eminsin?','How sure are you?')),...[['e',L('Eminim','Sure')],['b',L('Biraz','Fairly')],['t',L('Tahmin','Guessing')]].map(([k,t])=>el('button',{class:'chip',type:'button','aria-pressed':'false',onclick:e=>{conf=k;confRow.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));e.currentTarget.setAttribute('aria-pressed','true');ansBox.classList.remove('hidden')}},tx(t))));
    const fb=el('div',{class:'fb hidden'});const ansBox=el('div',{class:'body hidden'});
    const next=el('button',{class:'btn hidden',type:'button',onclick:()=>{qi++;qi<Q.length?ask():finish()}},tx(qi<Q.length-1?L('Sonraki soru','Next question'):L('Sonucu gör','See result')));
    const answer=ok=>{res.push({k:q[0],ok,conf,q:tx(q[1])});fb.className='fb '+(ok?'ok':'bad');fb.innerHTML='<b>'+tx(ok?UI.right:UI.wrong)+'</b> '+tx(q[3]);next.classList.remove('hidden');confRow.querySelectorAll('button').forEach(b=>b.disabled=true)};
    if(Array.isArray(q[2])){const order=shuffle(q[2].map((o,i)=>i));const bs=order.map(i=>el('button',{class:'opt',type:'button',html:tx(q[2][i]),onclick:()=>{bs.forEach(b=>b.disabled=true);const ok=i===0;bs[order.indexOf(i)].classList.add(ok?'right':'wrong');if(!ok)bs[order.indexOf(0)].classList.add('right');answer(ok)}}));ansBox.append(...bs)}
    else{const inp=el('input',{type:'text',inputmode:'decimal',class:'numin','aria-label':tx(UI.yourAns)});const go=()=>{const val=parseNum(inp.value);if(!isFinite(val))return;b.disabled=true;inp.disabled=true;const ok=Math.abs(val-q[2])<=(q[4]??.01)+1e-9;inp.style.borderColor=ok?'var(--ok)':'var(--bad)';answer(ok)};const b=el('button',{class:'btn sm',type:'button',onclick:go},tx(UI.answer));inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!b.disabled)go()});ansBox.append(el('div',{class:'row'},inp,b),el('p',{class:'hint'},tx(UI.numHint)))}
    area.append(el('div',{class:'qcard'},el('p',{class:'mono',style:'margin:0'},`${tx(L('Soru','Question'))} ${qi+1} / ${Q.length} · ${tx(K[q[0]])}`),el('p',{style:'font-size:1.05rem;margin:0'},el('b',{},tx(q[1]))),confRow,ansBox,fb,next))};
  const finish=()=>{area.innerHTML='';const score=res.filter(r=>r.ok).length;S.karma={score,total:res.length,at:Date.now()};markDone('k-tur');save();GC('karma/'+plan+'/'+score+'-'+res.length);
    area.append(el('p',{style:'font-size:1.1rem'},el('b',{},tx(L(`Sonuç: ${score} / ${res.length}`,`Result: ${score} / ${res.length}`)))));
    for(const k of Object.keys(K)){const rs=res.filter(r=>r.k===k);if(!rs.length)continue;const p=rs.filter(r=>r.ok).length/rs.length;area.append(el('div',{class:'kbar'},el('span',{},tx(K[k])),el('span',{class:'bar'},el('i',{style:`width:${p*100}%;background:${p>=.99?'var(--ok)':p>=.5?'var(--warn)':'var(--bad)'}`})),el('span',{class:'mono'},`${rs.filter(r=>r.ok).length}/${rs.length}`)))}
    const cw=res.filter(r=>!r.ok&&r.conf==='e');
    if(cw.length)area.append(el('div',{class:'fb bad',html:'<b>'+tx(L('Emin olup yanlış yaptıkların','Wrong although you felt sure'))+'</b> '+tx(L('(önce bunları çalış):','(study these first):'))+'<br>'+cw.map(r=>'• '+r.q).join('<br>')}));
    const weak=[...new Set(res.filter(r=>!r.ok).map(r=>KST[r.k]))];
    if(weak.length)area.append(el('p',{},tx(L('Tekrar etmen önerilen istasyonlar: ','Stations to revisit: ')),...weak.map(w=>el('button',{class:'chip',type:'button',onclick:()=>show(w)},tx(STATIONS.find(s=>s.id===w).ad)))));
    else area.append(el('div',{class:'fb ok',html:'<b>'+tx(L('Harika!','Excellent!'))+'</b> '+tx(L('Bütün soruları doğru yaptın.','You got every question right.'))}));
    area.append(el('div',{style:'height:8px'}),el('button',{class:'btn',type:'button',onclick:intro},tx(L('Yeni tur','New round'))))};
  intro();
}

/* =====================================================================
   0) HARİTA
   ===================================================================== */
const RULES=[
  L('sin = karşı / hipotenüs · cos = komşu / hipotenüs · tan = karşı / komşu · cot = komşu / karşı','sin = opposite / hypotenuse · cos = adjacent / hypotenuse · tan = opposite / adjacent · cot = adjacent / opposite'),
  L('sin²x + cos²x = 1 ve tan x · cot x = 1. Tümler açılarda: sin(90° − x) = cos x, tan(90° − x) = cot x.','sin²x + cos²x = 1 and tan x · cot x = 1. Complementary angles: sin(90° − x) = cos x, tan(90° − x) = cot x.'),
  L('Birim çemberde P(cos θ, sin θ). sin(180° − θ) = sin θ, cos(180° − θ) = −cos θ. Negatif yönlü açı saat yönünde ölçülür.','On the unit circle P(cos θ, sin θ). sin(180° − θ) = sin θ, cos(180° − θ) = −cos θ. Negative directed angles go clockwise.'),
  L('İç açıortay: |BD| / |DC| = |AB| / |AC| (dış açıortayda da aynı oran). Ağırlık merkezi kenarortayı köşeden 2 : 1 böler.','Angle bisector: |BD| / |DC| = |AB| / |AC| (same ratio for the exterior bisector). The centroid divides each median 2 : 1 from the vertex.'),
  L('Kesim noktaları: kenarortaylar → G · kenar orta dikmeler → O (köşelere eşit uzak) · iç açıortaylar → I (kenarlara eşit uzak) · yükseklikler → H.','Meeting points: medians → G · perpendicular bisectors → O (equidistant from vertices) · angle bisectors → I (equidistant from sides) · altitudes → H.'),
  L('Dik üçgende hipotenüse ait kenarortay = hipotenüsün yarısı = çevrel çemberin yarıçapı.','In a right triangle, median to the hypotenuse = half the hypotenuse = circumradius.'),
  L('Alan = ½ · taban · yükseklik = ½ · b · c · sin A. Yükseklik ortaksa alanlar tabanlarla orantılı; benzerlik oranı k ise alanlar oranı k².','Area = ½ · base · height = ½ · b · c · sin A. Common height → areas proportional to bases; similarity ratio k → area ratio k².'),
  L('a / sin A = b / sin B = c / sin C = 2R · a² = b² + c² − 2bc · cos A.','a / sin A = b / sin B = c / sin C = 2R · a² = b² + c² − 2bc · cos A.'),
];
const CHECK=[
  L('Dik üçgende sin, cos, tan, cot’u kenar oranı olarak yazabiliyor; 30°, 45°, 60° değerlerini çıkarabiliyorum.','I can write sin, cos, tan, cot as side ratios and derive the values for 30°, 45°, 60°.'),
  L('Birim çemberde bir açının noktasının koordinatlarını ve yönlü açıyı açıklayabiliyorum.','I can give the coordinates of the point for an angle on the unit circle and explain directed angles.'),
  L('Açıortay, kenarortay, kenar orta dikme ve yüksekliklerin özelliklerini problemde kullanabiliyorum.','I can use the properties of bisectors, medians, perpendicular bisectors and altitudes in problems.'),
  L('Taban ya da yükseklik değişince alanın nasıl değiştiğini açıklayabiliyorum.','I can explain how the area changes when the base or the height changes.'),
  L('Sinüs teoremini alanla doğrulayabiliyor, kosinüs teoremini Pisagor ile ispatlayabiliyorum.','I can verify the sine theorem using area and prove the cosine theorem using Pythagoras.'),
  L('Bağlam (gerçek yaşam) problemlerinde hangi teoremi kullanacağımı seçebiliyorum.','I can choose which theorem to use in real-life context problems.'),
];
const SEN=[['10.1.1',L('Dik üçgende trigonometrik oranlar ve özdeşlikler','Trigonometric ratios and identities in a right triangle'),2,2],['10.1.2',L('Üçgenin yardımcı elemanları','Special lines of a triangle'),2,2],['10.1.3',L('Üçgenin alanı','Area of a triangle'),2,1],['10.1.4',L('Sinüs ve kosinüs teoremleri','Sine and cosine theorems'),2,1]];
let resetArm=false;
function build_harita(v){
  v.innerHTML='';
  const tbl=el('table',{class:'sen'});
  const hl=k=>S.sen===k?'c hl':'c';
  tbl.append(el('tr',{},el('th',{},tx(L('Öğrenme çıktısı','Learning outcome'))),el('th',{class:hl('s4')},tx(L('Senaryo 4','Scenario 4'))),el('th',{class:hl('s5')},tx(L('Senaryo 5','Scenario 5')))));
  SEN.forEach(([k,n,a,b])=>tbl.append(el('tr',{},el('td',{},el('span',{class:'kod'},'MAT.'+k),' ',tx(n)),el('td',{class:hl('s4')},a),el('td',{class:hl('s5')},b))));
  tbl.append(el('tr',{},el('td',{},el('b',{},tx(L('Toplam soru','Total questions')))),el('td',{class:hl('s4')},el('b',{},'8')),el('td',{class:hl('s5')},el('b',{},'6'))));
  const senSeg=segChips([['s4',L('Senaryo 4','Scenario 4')],['s5',L('Senaryo 5','Scenario 5')],['x',L('Bilmiyorum','Not sure')]],S.sen||'x',k=>{S.sen=k==='x'?null:k;save();build_harita(v);build_karma(views.karma)});
  v.append(el('div',{class:'grid2'},
    el('div',{class:'card'},el('h2',{},tx(L('Sınavda ne var?','What is on the exam?'))),
      el('p',{class:'lead'},tx(L('İki senaryo da yalnızca 1. temadan (Geometrik Şekiller) soru içerir; fark soru sayılarındadır. Senaryonu seç: Karma Tur buna göre ayarlanır.','Both scenarios use only Theme 1 (Geometric Shapes); they differ only in the number of questions. Choose your scenario and the Mixed Round adapts to it.'))),
      senSeg,tbl,el('p',{class:'hint',style:'margin:8px 0 0'},tx(L('Kaynak: MEB 10. sınıf matematik 1. dönem 1. ortak yazılı konu soru dağılım tablosu.','Source: MEB Grade 10 mathematics Term 1 Exam 1 question distribution table.')))),
    el('div',{class:'card'},el('h2',{},tx(L('Nereden başlamalı?','Where to start?'))),
      el('p',{class:'lead'},tx(L('Önerilen sıra: Trigonometrik Oranlar → Yardımcı Elemanlar → Üçgenin Alanı → Sinüs ve Kosinüs Teoremleri → Karma Tur. Alan istasyonundaki ½ · b · c · sin A, sinüs teoreminin doğrulamasında yeniden kullanılır.','Suggested order: Trigonometric Ratios → Special Lines → Area → Sine & Cosine Theorems → Mixed Round. The formula ½ · b · c · sin A from the Area station is used again to verify the sine theorem.'))),
      el('p',{class:'hint',style:'margin:0'},tx(L('Soruda yaklaşık değer verilmişse (ör. sin 70° ≈ 0,94) onu kullan.','If a question gives an approximate value (e.g. sin 70° ≈ 0.94), use it.'))))));
  const grid=el('div',{class:'stations'});
  const DESC={oran:L('Açıyı ve ölçeği değiştir; oranlar, özel açılar, tümler açılar ve birim çember.','Change the angle and the scale; ratios, special angles, complementary angles and the unit circle.'),
    yard:L('Köşeleri sürükle; açıortay, kenarortay, kenar orta dikme, yükseklik ve kesim noktaları.','Drag the vertices; bisectors, medians, perpendicular bisectors, altitudes and their meeting points.'),
    alan:L('Taban–yükseklik değişimi, paralel doğrular arasında alan ve sinüslü alan.','Changing base and height, area between parallel lines, and area with sine.'),
    teo:L('Oranları ve 2R’yi karşılaştır; kosinüs teoremini Pisagor ile ilişkilendir; ispat adımlarını sırala.','Compare the ratios with 2R; link the cosine theorem to Pythagoras; order the proof steps.'),
    karma:L('Senaryo 4 ya da 5 provası: sınav dağılımında karışık sorular ve güven seçimi.','Scenario 4 or 5 rehearsal: mixed questions in the exam distribution, with confidence ratings.')};
  STATIONS.slice(1).forEach(s=>{const ts=TASKS[s.id]||[];const d=ts.filter(t=>S.done[t]).length;
    grid.append(el('div',{class:'card st'},el('h3',{},tx(s.ad)),el('span',{class:'kod',style:'align-self:flex-start'},tx(s.kod)),el('p',{class:'hint',style:'margin:0'},tx(DESC[s.id])),
      el('div',{class:'ring'},el('span',{class:'bar'},el('i',{style:`width:${ts.length?d/ts.length*100:0}%`})),`${d}/${ts.length}`),
      el('button',{class:'btn sm',type:'button',style:'align-self:flex-start',onclick:()=>show(s.id)},tx(L('Git','Go')))))});
  v.append(el('div',{style:'height:14px'}),grid,el('div',{style:'height:14px'}));
  const two=el('div',{class:'grid2'});
  two.append(el('div',{class:'card'},el('h3',{},tx(L('Cebimdeki 8 cümle','8 pocket rules'))),el('ol',{class:'rules'},...RULES.map(t=>el('li',{},tx(t))))));
  const ck=el('div',{class:'card'},el('h3',{},tx(L('Kendimi kontrol ediyorum','Self-check'))));
  CHECK.forEach((t,i)=>{const cb=el('input',{type:'checkbox',id:'ck'+i,style:'width:18px;height:18px;accent-color:var(--ok);flex:none;margin-top:2px'});cb.checked=!!S.check[i];cb.addEventListener('change',()=>{S.check[i]=cb.checked;save()});
    ck.append(el('label',{for:'ck'+i,style:'display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:.93rem'},cb,el('span',{},tx(t))))});
  const rb=el('button',{class:'btn ghost sm',type:'button',onclick:()=>{if(!resetArm){resetArm=true;rb.className='btn danger sm';rb.textContent=tx(L('Emin misin? Bütün ilerleme silinir.','Are you sure? All progress will be deleted.'));setTimeout(()=>{if(resetArm){resetArm=false;rb.className='btn ghost sm';rb.textContent=tx(L('İlerlemeyi sıfırla','Reset progress'))}},4000);return}
    resetArm=false;const lg=LANG;S={done:{},karma:null,check:{},sen:null,lang:lg};save();location.reload()}},tx(L('İlerlemeyi sıfırla','Reset progress')));
  ck.append(el('div',{style:'height:8px'}),rb);
  two.append(ck);v.append(two);
}

/* ================= genel ================= */
function updateProgress(){
  let all=0,d=0;STATIONS.slice(1).forEach(s=>{const ts=TASKS[s.id]||[];const dd=ts.filter(t=>S.done[t]).length;all+=ts.length;d+=dd;const c=$('#tc-'+s.id);if(c)c.textContent=ts.length?`${dd}/${ts.length}`:''});
  $('#totTxt').textContent=`${d} / ${all} ${tx(UI.tasks)}`;$('#totBar').style.width=(all?d/all*100:0)+'%';
}
function buildAll(){
  document.documentElement.lang=LANG;document.title=tx(UI.title);
  $('#h1a').firstChild.textContent=tx(UI.h1a);$('#h1b').textContent=tx(UI.h1b);$('#sub').textContent=tx(UI.sub);$('#foot').textContent=tx(UI.foot);
  $('#lgTr').setAttribute('aria-pressed',String(LANG==='tr'));$('#lgEn').setAttribute('aria-pressed',String(LANG==='en'));
  buildTabs();
  STATIONS.forEach(s=>{if(!TASKS[s.id])TASKS[s.id]=[]});
  build_oran(views.oran);build_yard(views.yard);build_alan(views.alan);build_teo(views.teo);build_karma(views.karma);
  regTask('karma','k-tur');
  build_harita(views.harita);
  ['oran','yard','alan','teo'].forEach(runChecks);
  updateProgress();
}
function setLang(l){if(l===LANG)return;LANG=l;S.lang=l;save();
  try{const u=new URL(location.href);u.searchParams.set('lang',l);history.replaceState(null,'',u)}catch(e){}
  buildAll();GC('dil/'+l)}
$('#lgTr').onclick=()=>setLang('tr');$('#lgEn').onclick=()=>setLang('en');
buildAll();
})();
