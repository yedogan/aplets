<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matematik Apletleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;700&display=swap">
<script>
/* ================================================================
   APLET LİSTESİ — yeni aplet eklemek için buraya bir satır ekle.
   dosya    : depodaki HTML dosyasının adı
   ad       : görünen ad
   sinif    : 5, 6, 7, 8, 9, 10, 11, 12
   alan     : Geometri / Sayılar ve İşlemler / Cebir / Trigonometri / Veri ve Olasılık / Fonksiyonlar ...
   dil      : "tr" veya "en"
   konular  : etiketler (arama ve filtrelemede kullanılır)
   kazanim  : MEB öğrenme çıktısı kodu (yoksa "")
   eklendi  : YYYY-AA-GG (son 30 gün içindekiler "Yeni" etiketi alır)
   anahtar  : (isteğe bağlı) görünmeyen ek arama kelimeleri
   ================================================================ */
const APLETLER = [
  { dosya:"ifade-atolyesi-10.html", ad:"İfade Atölyesi 10", sinif:10, alan:"Geometri", dil:"tr",
    konular:["kenarortay","iç açıortay","dış açıortay","yükseklik","kenar orta dikme","özel noktalar","üçgen eşitsizliği","birim çember"],
    aciklama:"Üçgenin yardımcı elemanları ve birim çemberle ilgili 79 ifade: tahmin et, şekli sürükleyerek dene, karar ver, gerekçelendir.",
    kazanim:"MAT.10.1.2", eklendi:"2026-10-13" },
  { dosya:"conjecture-lab.html", ad:"Conjecture Lab", sinif:10, alan:"Geometri", dil:"en",
    konular:["medians","angle bisectors","external bisectors","altitudes","perpendicular bisectors","special points","unit circle"],
    aciklama:"English version of İfade Atölyesi 10: predict, test by dragging, decide and justify 79 statements about triangles and the unit circle.",
    kazanim:"MAT.10.1.2", eklendi:"2026-10-13",
    anahtar:"kenarortay iç açıortay dış açıortay yükseklik orta dikme özel noktalar birim çember ingilizce" },
  { dosya:"ifade-atolyesi-5.html", ad:"İfade Atölyesi 5", sinif:5, alan:"Geometri", dil:"tr",
    konular:["nokta ve doğru","çember","açılar","paralel ve dik doğrular","dörtgenler","köşegenler","üçgen"],
    aciklama:"“… ise …” biçimindeki geometri ifadelerini şekli sürükleyerek sına; ifadeyi bozan bir karşıt örnek bulabilecek misin?",
    kazanim:"", eklendi:"2026-10-05" },
  { dosya:"sayi-dogrusu-7.html", ad:"Sayı Doğrusu Atölyesi", sinif:7, alan:"Sayılar ve İşlemler", dil:"tr",
    konular:["rasyonel sayılar","sayı doğrusu","mutlak değer","ondalık açılım","toplama ve çıkarma"],
    aciklama:"Rasyonel sayıları sayı doğrusuna yerleştir, mutlak değeri mesafe olarak gör, ondalık açılımı ve toplama–çıkarmayı modelle.",
    kazanim:"MAT.7.1.1–7.1.4", eklendi:"2026-10-06" },
];
</script>
<style>
:root{--bg:#f5f3ed;--card:#fffefb;--fg:#1c2230;--mute:#5d6576;--line:#dcd6c8;--soft:#ebe6da;--acc:#1f4e8c;--acc-bg:#e3ebf7;--new:#a3470f;--new-bg:#fbe8d9;--ok:#2f6b3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161c;--card:#1b1f27;--fg:#e7eaf0;--mute:#9ba3b4;--line:#2d3340;--soft:#232834;--acc:#90b5ee;--acc-bg:#22304a;--new:#f0a46e;--new-bg:#3a2618;--ok:#8fd09b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13161c;--card:#1b1f27;--fg:#e7eaf0;--mute:#9ba3b4;--line:#2d3340;--soft:#232834;--acc:#90b5ee;--acc-bg:#22304a;--new:#f0a46e;--new-bg:#3a2618;--ok:#8fd09b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding-inline:16px}
header{padding-block:32px 8px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:clamp(1.6rem,4vw,2.1rem);margin:0;text-wrap:balance}
.lead{color:var(--mute);margin:4px 0 0}
.bar{background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search:focus-within{border-color:var(--acc)}
.search svg{flex:none;color:var(--mute)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;padding:11px 0;outline:none}
.search button{border:0;background:none;color:var(--mute);font:inherit;cursor:pointer;padding:4px}
.filters{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.frow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flabel{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);width:52px;flex:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:.88rem;padding:3px 11px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.chip .n{opacity:.6;font-size:.8em;margin-left:3px;font-variant-numeric:tabular-nums}
.status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:.88rem;color:var(--mute)}
.linkbtn{border:0;background:none;color:var(--acc);font:inherit;font-weight:700;cursor:pointer;padding:0}
main{padding-block:8px 48px}
section{margin-top:22px}
h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.15rem;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
h2 small{font:400 .85rem "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--mute)}
ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
li{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:14px 16px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.main{min-width:0}
.t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t a{font-weight:700;font-size:1.05rem;color:var(--fg);text-decoration:none}
.t a:hover{color:var(--acc);text-decoration:underline}
.badge{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--mute)}
.badge.new{background:var(--new-bg);color:var(--new)}
.badge.lang{background:var(--acc-bg);color:var(--acc)}
.d{color:var(--mute);font-size:.93rem;margin:3px 0 6px;max-width:68ch}
.tags{display:flex;flex-wrap:wrap;gap:4px 6px}
.tag{border:0;background:var(--soft);color:var(--fg);font:inherit;font-size:.78rem;padding:1px 8px;border-radius:6px;cursor:pointer}
.tag:hover{background:var(--acc-bg);color:var(--acc)}
.code{font-size:.78rem;color:var(--mute);font-variant-numeric:tabular-nums}
.act{display:flex;flex-direction:column;gap:6px;align-items:stretch;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;border:1px solid var(--acc);background:var(--acc);color:var(--bg);font:inherit;font-size:.9rem;font-weight:700;padding:6px 14px;border-radius:8px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.done{border-color:var(--ok);color:var(--ok)}
mark{background:var(--new-bg);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:28px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px;margin-top:22px}
footer{color:var(--mute);font-size:.85rem;padding-block:0 32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:700px) and (min-height:640px){.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}}
@media (max-width:560px){li{grid-template-columns:1fr}.act{flex-direction:row}.act .btn{flex:1}.flabel{width:auto;flex-basis:100%}}
</style></head><body>
<div class="wrap">
<header>
  <h1>Matematik Apletleri</h1>
  <p class="lead" id="lead"></p>
</header>
<div class="bar">
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span class="sr">Ara</span>
    <input id="q" type="search" placeholder="Ara: açıortay, birim çember, rasyonel, MAT.10…" autocomplete="off">
    <button id="clr" type="button" hidden aria-label="Aramayı temizle">✕</button>
  </label>
  <div class="filters" id="filters"></div>
  <div class="status"><span id="count" aria-live="polite"></span><button class="linkbtn" id="share" type="button" hidden>Bu listenin linkini kopyala</button></div>
</div>
<main id="list"></main>
<footer>Hazırlayan: Yunus Emre Doğan · Apletler tarayıcıda çalışır; ilerleme her öğrencinin kendi tarayıcısında saklanır.</footer>
</div>
<script>
(function(){
const LANG={tr:"Türkçe",en:"English"};
const norm=s=>String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ı/g,'i');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const days=d=>(Date.now()-new Date(d+'T00:00:00').getTime())/864e5;
const base=location.href.replace(/[?#].*$/,'').replace(/index\.html$/,'');
const items=APLETLER.map((a,i)=>({...a,i,hay:norm([a.ad,a.aciklama,a.alan,a.kazanim,a.sinif+'. sinif',LANG[a.dil],a.anahtar||'',...a.konular].join(' '))}));

const st={q:'',sinif:null,alan:null,dil:null};
try{const u=new URLSearchParams(location.search);st.q=u.get('q')||'';st.sinif=u.get('sinif');st.alan=u.get('alan');st.dil=u.get('dil')}catch(e){}

const dims=[
  {key:'sinif',label:'Sınıf',val:a=>String(a.sinif),txt:v=>v+'. sınıf',sort:(x,y)=>x-y},
  {key:'alan',label:'Alan',val:a=>a.alan,txt:v=>v,sort:(x,y)=>x.localeCompare(y,'tr')},
  {key:'dil',label:'Dil',val:a=>a.dil,txt:v=>LANG[v]||v,sort:(x,y)=>x.localeCompare(y)},
];
const $=id=>document.getElementById(id);
const qEl=$('q');qEl.value=st.q;
$('lead').textContent=`${items.length} aplet · ${new Set(items.map(a=>a.sinif)).size} sınıf düzeyi. Ara ya da filtrele; her apletin linkini kopyalayıp Classroom'a ekleyebilirsin.`;

function matches(a,skip){
  if(st.q){const terms=norm(st.q).split(/\s+/).filter(Boolean);if(!terms.every(t=>a.hay.includes(t)))return false}
  for(const d of dims){if(d.key!==skip&&st[d.key]&&d.val(a)!==st[d.key])return false}
  return true;
}
function renderFilters(){
  const box=$('filters');box.innerHTML='';
  for(const d of dims){
    const vals=[...new Set(items.map(d.val))].sort(d.sort);
    if(vals.length<2)continue;
    const row=document.createElement('div');row.className='frow';row.setAttribute('role','group');row.setAttribute('aria-label',d.label);
    row.innerHTML=`<span class="flabel">${d.label}</span>`;
    const mk=(v,t,n)=>{const b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed',String(st[d.key]===v));
      if(d.key==='dil'&&v)b.lang=v;b.innerHTML=esc(t)+(n!=null?`<span class="n">${n}</span>`:'');b.onclick=()=>{st[d.key]=v;update()};row.appendChild(b)};
    mk(null,'Tümü');
    const pool=items.filter(a=>matches(a,d.key));
    for(const v of vals)mk(v,d.txt(v),pool.filter(a=>d.val(a)===v).length);
    box.appendChild(row);
  }
}
function hl(text){
  if(!st.q)return esc(text);
  const terms=norm(st.q).split(/\s+/).filter(t=>t.length>1);if(!terms.length)return esc(text);
  const n=norm(text);if(n.length!==text.length)return esc(text);
  const marks=new Array(text.length).fill(false);
  for(const t of terms){let i=n.indexOf(t);while(i>-1){for(let k=i;k<i+t.length;k++)marks[k]=true;i=n.indexOf(t,i+1)}}
  let out='',on=false;for(let k=0;k<text.length;k++){if(marks[k]!==on){out+=on?'</mark>':'<mark>';on=marks[k]}out+=esc(text[k])}
  return out+(on?'</mark>':'');
}
function renderList(){
  const res=items.filter(a=>matches(a));
  const L=$('list');L.innerHTML='';
  $('count').textContent=res.length===items.length?`${res.length} aplet`:`${res.length} / ${items.length} aplet gösteriliyor`;
  if(!res.length){L.innerHTML=`<div class="empty">Bu aramaya uyan aplet yok. <button class="linkbtn" type="button" id="reset">Filtreleri temizle</button></div>`;$('reset').onclick=()=>{st.q='';qEl.value='';st.sinif=st.alan=st.dil=null;update()};return}
  const groups=[...new Set(res.map(a=>a.sinif))].sort((x,y)=>x-y);
  for(const g of groups){
    const sec=document.createElement('section');
    const arr=res.filter(a=>a.sinif===g).sort((x,y)=>y.eklendi.localeCompare(x.eklendi)||(x.dil==='tr'?0:1)-(y.dil==='tr'?0:1)||x.ad.localeCompare(y.ad,'tr'));
    sec.innerHTML=`<h2>${g}. sınıf <small>${arr.length} aplet</small></h2>`;
    const ul=document.createElement('ul');
    for(const a of arr){
      const li=document.createElement('li');
      const isNew=days(a.eklendi)<=30;
      li.innerHTML=`<div class="main"><div class="t"><a href="${esc(a.dosya)}">${hl(a.ad)}</a>${isNew?'<span class="badge new">Yeni</span>':''}<span class="badge">${esc(a.alan)}</span>${a.dil!=='tr'?`<span class="badge lang" lang="${esc(a.dil)}">${esc(LANG[a.dil]||a.dil)}</span>`:''}</div>
        <p class="d" ${a.dil==='en'?'lang="en"':''}>${hl(a.aciklama)}</p>
        <div class="tags">${a.konular.map(k=>`<button type="button" class="tag" ${a.dil==='en'?'lang="en"':''}>${hl(k)}</button>`).join('')}${a.kazanim?`<span class="code">${esc(a.kazanim)}</span>`:''}</div></div>
        <div class="act"><a class="btn" href="${esc(a.dosya)}">Aç</a><button type="button" class="btn ghost copy">Linki kopyala</button></div>`;
      li.querySelectorAll('.tag').forEach(b=>b.onclick=()=>{qEl.value=b.textContent;st.q=b.textContent;update();qEl.focus()});
      li.querySelector('.copy').onclick=e=>copy(base+a.dosya,e.currentTarget);
      ul.appendChild(li);
    }
    sec.appendChild(ul);L.appendChild(sec);
  }
}
function viewUrl(){const u=new URLSearchParams();if(st.q)u.set('q',st.q);for(const d of dims)if(st[d.key])u.set(d.key,st[d.key]);const s=u.toString();return base+(s?'?'+s:'')}
function update(){
  $('clr').hidden=!st.q;
  const filtered=st.q||dims.some(d=>st[d.key]);$('share').hidden=!filtered;
  try{history.replaceState(null,'',viewUrl())}catch(e){}
  renderFilters();renderList();
}
function copy(text,btn){
  const old=btn.textContent;
  const done=ok=>{btn.textContent=ok?'Kopyalandı ✓':'Kopyalanamadı';btn.classList.toggle('done',ok);setTimeout(()=>{btn.textContent=old;btn.classList.remove('done')},1600)};
  const fallback=()=>{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();if(!ok)window.prompt?.('Linki kopyala:',text);done(ok)};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>done(true),fallback);else fallback();
}
let tm;qEl.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{st.q=qEl.value.trim();update()},120)});
qEl.addEventListener('keydown',e=>{if(e.key==='Escape'){qEl.value='';st.q='';update()}});
$('clr').onclick=()=>{qEl.value='';st.q='';update();qEl.focus()};
$('share').onclick=e=>copy(viewUrl(),e.currentTarget);
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==qEl){e.preventDefault();qEl.focus()}});
update();
})();
</script>
<script data-goatcounter="https://yedogan-aplets.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body></html>
