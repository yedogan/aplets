<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Appletler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;700&display=swap">
<script>
/* ================================================================
   APPLET LİSTESİ — yeni applet eklemek için buraya bir satır ekle.
   dosya    : depodaki HTML dosyasının adı
   ad       : görünen ad
   sinif    : 5, 6, 7, 8, 9, 10, 11, 12
   ders     : Matematik / Fen Bilimleri / Fizik / Kimya / Biyoloji / Türkçe ...
   alan     : dersin içindeki alan ya da tür (Geometri, Sayılar ve İşlemler, Sınav hazırlığı ...)
   dil      : "tr" veya "en"
   konular  : etiketler (arama ve filtrelemede kullanılır)
   kazanim  : MEB öğrenme çıktısı kodu (yoksa "")
   eklendi  : YYYY-AA-GG (son 30 gün içindekiler "Yeni" etiketi alır)
   anahtar  : (isteğe bağlı) görünmeyen ek arama kelimeleri
   ================================================================ */
const APPLETLER = [
  { dosya:"fen-genel-tekrar-5.html", ad:"5. Sınıf Fen Bilimleri, 1. Dönem 1. Yazılı Sınav - Genel Tekrar", sinif:5, ders:"Fen Bilimleri", alan:"Sınav hazırlığı", dil:"tr",
    konular:["Ay’ın özellikleri","dönme ve dolanma","Ay’ın evreleri","Güneş, Dünya ve Ay modeli","hacimsel büyüklük"],
    aciklama:"Gök taşı ve sıcaklık simülasyonu, Ay’ın dönme–dolanma modeli, evre laboratuvarı (sürükle, adlandır, konum bul, sırala), Güneş–Dünya–Ay animasyonunu düzeltme ve karışık bir tekrar turu.",
    kazanim:"FB.5.1.2 · 5.1.3 · 5.1.4", eklendi:"2026-10-31",
    anahtar:"ortak yazılı oyss senaryo 2 krater atmosfer yeni ay ilk dördün dolunay son dördün hilal şişkin ay 29,5 gün 27 gün 8 saat" },
  { dosya:"fen-genel-tekrar-7.html", ad:"7. Sınıf Fen Bilimleri, 1. Dönem 1. Yazılı Sınav - Genel Tekrar", sinif:7, ders:"Fen Bilimleri", alan:"Sınav hazırlığı", dil:"tr",
    konular:["uzay teknolojileri","uzay kirliliği","yıldızların yaşamı","iş","kinetik enerji","potansiyel enerji"],
    aciklama:"Uzay araçları, uzay kirliliği, yıldızların yaşamı, iş ve enerji: simülasyonlu istasyonlar, görevler ve karışık bir tekrar turu.",
    kazanim:"FB.7.1.1 · 7.1.3 · 7.1.4 · 7.2.1 · 7.2.2", eklendi:"2026-10-29",
    anahtar:"ortak yazılı oyss senaryo 3 teleskop uydu sonda mekik süpernova beyaz cüce joule" },
  { dosya:"fen-genel-tekrar-8.html", ad:"8. Sınıf Fen Bilimleri, 1. Dönem 1. Yazılı Sınav - Genel Tekrar", sinif:8, ders:"Fen Bilimleri", alan:"Sınav hazırlığı", dil:"tr",
    konular:["mevsimlerin oluşumu","DNA","gen","kromozom","nükleotid","DNA eşlenmesi","değişkenler"],
    aciklama:"Mevsim laboratuvarı, DNA modeli kurma, hata avı, eşlenme simülasyonu, değişken dedektifi ve karışık bir tekrar turu.",
    kazanim:"F.8.1.1.1 · F.8.2.1.1–F.8.2.1.3", eklendi:"2026-10-29",
    anahtar:"ortak yazılı oyss senaryo 1 eksen eğikliği gölge hidrojen bağı adenin timin guanin sitozin" },
  { dosya:"mat10-genel-tekrar.html", ad:"10. Sınıf Matematik, 1. Dönem 1. Yazılı Sınav - Genel Tekrar", sinif:10, ders:"Matematik", alan:"Sınav hazırlığı", dil:"tr",
    konular:["trigonometrik oranlar","birim çember","açıortay","kenarortay","yükseklik","üçgenin alanı","sinüs teoremi","kosinüs teoremi"],
    aciklama:"Senaryo 4 ve 5 için: oran laboratuvarı, birim çember, yardımcı eleman atölyesi, alan ve teorem laboratuvarları, senaryo provalı karma tur. İngilizce seçeneği var.",
    kazanim:"MAT.10.1.1–10.1.4", eklendi:"2026-10-30",
    anahtar:"ortak yazılı oyss senaryo 4 senaryo 5 sinüs kosinüs tanjant kotanjant özdeşlik ağırlık merkezi çevrel çember iç teğet çember diklik merkezi" },
  { dosya:"mat10-genel-tekrar.html?lang=en", ad:"Grade 10 Mathematics, Term 1 Exam 1 - Review", sinif:10, ders:"Matematik", alan:"Sınav hazırlığı", dil:"en",
    konular:["trigonometric ratios","unit circle","angle bisector","median","altitude","area of a triangle","sine theorem","cosine theorem"],
    aciklama:"English version of the Grade 10 review for Scenarios 4 and 5: ratio lab, unit circle, special lines workshop, area and theorem labs, and a mixed round with scenario rehearsals.",
    kazanim:"MAT.10.1.1–10.1.4", eklendi:"2026-10-30",
    anahtar:"ingilizce ortak yazılı oyss senaryo 4 senaryo 5 trigonometrik oranlar açıortay kenarortay sinüs kosinüs teoremi centroid circumcentre incentre orthocentre" },
  { dosya:"ifade-atolyesi-10.html", ad:"İfade Atölyesi 10", sinif:10, ders:"Matematik", alan:"Geometri", dil:"tr",
    konular:["kenarortay","iç açıortay","dış açıortay","yükseklik","kenar orta dikme","özel noktalar","üçgen eşitsizliği","birim çember"],
    aciklama:"Üçgenin yardımcı elemanları ve birim çemberle ilgili 79 ifade: tahmin et, şekli sürükleyerek dene, karar ver, gerekçelendir.",
    kazanim:"MAT.10.1.2", eklendi:"2026-10-13" },
  { dosya:"conjecture-lab.html", ad:"Conjecture Lab", sinif:10, ders:"Matematik", alan:"Geometri", dil:"en",
    konular:["medians","angle bisectors","external bisectors","altitudes","perpendicular bisectors","special points","unit circle"],
    aciklama:"English version of İfade Atölyesi 10: predict, test by dragging, decide and justify 79 statements about triangles and the unit circle.",
    kazanim:"MAT.10.1.2", eklendi:"2026-10-13",
    anahtar:"kenarortay iç açıortay dış açıortay yükseklik orta dikme özel noktalar birim çember ingilizce" },
  { dosya:"ifade-atolyesi-5.html", ad:"İfade Atölyesi 5", sinif:5, ders:"Matematik", alan:"Geometri", dil:"tr",
    konular:["nokta ve doğru","çember","açılar","paralel ve dik doğrular","dörtgenler","köşegenler","üçgen"],
    aciklama:"“… ise …” biçimindeki geometri ifadelerini şekli sürükleyerek sına; ifadeyi bozan bir karşıt örnek bulabilecek misin?",
    kazanim:"", eklendi:"2026-10-05" },
  { dosya:"sayi-dogrusu-7.html", ad:"Sayı Doğrusu Atölyesi", sinif:7, ders:"Matematik", alan:"Sayılar ve İşlemler", dil:"tr",
    konular:["rasyonel sayılar","sayı doğrusu","mutlak değer","ondalık açılım","toplama ve çıkarma"],
    aciklama:"Rasyonel sayıları sayı doğrusuna yerleştir, mutlak değeri mesafe olarak gör, ondalık açılımı ve toplama–çıkarmayı modelle.",
    kazanim:"MAT.7.1.1–7.1.4", eklendi:"2026-10-06" },
];
/* Derslerin gösterim sırası; listede olmayan dersler alfabetik olarak sona eklenir. */
const DERS_SIRASI=["Matematik","Fen Bilimleri","Fizik","Kimya","Biyoloji","Türkçe","Sosyal Bilgiler","İngilizce"];
</script>
<style>
:root{--bg:#f5f3ed;--card:#fffefb;--fg:#1c2230;--mute:#5d6576;--line:#dcd6c8;--soft:#ebe6da;--acc:#1f4e8c;--acc-bg:#e3ebf7;--new:#a3470f;--new-bg:#fbe8d9;--ok:#2f6b3a}
@media (prefers-color-scheme:dark){:root{--bg:#13161c;--card:#1b1f27;--fg:#e7eaf0;--mute:#9ba3b4;--line:#2d3340;--soft:#232834;--acc:#90b5ee;--acc-bg:#22304a;--new:#f0a46e;--new-bg:#3a2618;--ok:#8fd09b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:40px 0 16px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
h1{font-size:clamp(1.7rem,4vw,2.2rem)}
h2{font-size:1.3rem;margin:22px 0 4px}
h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search:focus-within{border-color:var(--acc)}
.search svg{flex:none;color:var(--mute)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;padding:11px 0;outline:none}
.search button{border:0;background:none;color:var(--mute);font:inherit;cursor:pointer;padding:4px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:20px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;padding:16px;border-radius:12px;cursor:pointer}
.tile:hover{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.tile b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.5rem;line-height:1.15}
.tile span{color:var(--mute);font-size:.88rem}
.back{border:0;background:none;color:var(--acc);font:inherit;font-weight:700;cursor:pointer;padding:0;margin-top:18px}
ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
li{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li>div{min-width:0}
.where{font-size:.8rem;color:var(--mute);margin:0}
.t a{font-weight:700;color:var(--fg);text-decoration:none}
.t a:hover{color:var(--acc);text-decoration:underline}
.d{color:var(--mute);font-size:.92rem;margin:2px 0 0}
.badge{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px;background:var(--acc-bg);color:var(--acc)}
.badge.new{background:var(--new-bg);color:var(--new)}
.act{display:flex;gap:6px;flex:none}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--bg);font:inherit;font-size:.88rem;font-weight:700;padding:6px 12px;border-radius:8px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.done{border-color:var(--ok);color:var(--ok)}
.tile:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.empty{padding:28px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px;margin-top:20px}
footer{color:var(--mute);font-size:.85rem;padding:32px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:560px){li{flex-direction:column;align-items:stretch}.act .btn{flex:1;text-align:center}.pick{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="wrap">
<header><h1>Appletler</h1></header>
<label class="search">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <span class="sr">Ara</span>
  <input id="q" type="search" placeholder="Ara…" autocomplete="off">
  <button id="clr" type="button" hidden aria-label="Aramayı temizle">✕</button>
</label>
<main id="list"></main>
<footer>Hazırlayan: Yunus Emre Doğan</footer>
</div>
<script>
(function(){
const norm=s=>String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ı/g,'i');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const isNew=a=>(Date.now()-new Date(a.eklendi+'T00:00:00'))/864e5<=30;
const base=location.href.replace(/[?#].*$/,'').replace(/index\.html$/,'');
const items=APPLETLER.map(a=>({...a,hay:norm([a.ad,a.aciklama,a.ders,a.alan,a.kazanim,a.sinif+'. sinif',a.anahtar||'',...a.konular].join(' '))}));
const sira=d=>{const k=DERS_SIRASI.indexOf(d);return k<0?99:k};
const byDers=(x,y)=>sira(x)-sira(y)||x.localeCompare(y,'tr');
const byItem=(x,y)=>y.eklendi.localeCompare(x.eklendi)||(x.dil==='tr'?0:1)-(y.dil==='tr'?0:1)||x.ad.localeCompare(y.ad,'tr');
const GRADES=[...new Set(items.map(a=>a.sinif))].sort((a,b)=>a-b);

const st={q:'',sinif:null,ders:null};
try{const u=new URLSearchParams(location.search);st.q=u.get('q')||'';const s=+u.get('sinif');st.sinif=GRADES.includes(s)?s:null;const d=u.get('ders');if(d&&st.sinif){const m=items.find(a=>slug(a.ders)===d);st.ders=m?m.ders:null}}catch(e){}

const $=id=>document.getElementById(id), qEl=$('q'), L=$('list');
qEl.value=st.q;

function row(a,where){
  const li=document.createElement('li');
  li.innerHTML=`<div>${where?`<p class="where">${a.sinif}. sınıf · ${esc(a.ders)}</p>`:''}<div class="t"><a href="${esc(a.dosya)}">${esc(a.ad)}</a>${isNew(a)?'<span class="badge new">Yeni</span>':''}${a.dil==='en'?'<span class="badge" lang="en">English</span>':''}</div><p class="d"${a.dil==='en'?' lang="en"':''}>${esc(a.aciklama)}</p></div>
  <div class="act"><a class="btn" href="${esc(a.dosya)}">Aç</a><button type="button" class="btn ghost">Linki kopyala</button></div>`;
  li.querySelector('button').onclick=e=>copy(base+a.dosya,e.currentTarget);
  return li;
}
function list(arr,where){const ul=document.createElement('ul');arr.forEach(a=>ul.appendChild(row(a,where)));return ul}
function go(s){st.sinif=s;st.ders=null;update();window.scrollTo({top:0})}

function render(){
  L.innerHTML='';
  if(st.q){
    const terms=norm(st.q).split(/\s+/).filter(Boolean);
    const res=items.filter(a=>terms.every(t=>a.hay.includes(t))).sort((x,y)=>x.sinif-y.sinif||byDers(x.ders,y.ders)||byItem(x,y));
    if(!res.length){L.innerHTML='<div class="empty">Bu aramaya uyan applet yok.</div>';return}
    const h=document.createElement('h3');h.textContent=res.length+' sonuç';L.append(h,list(res,true));return;
  }
  if(!st.sinif){
    const g=document.createElement('div');g.className='pick';
    for(const s of GRADES){const arr=items.filter(a=>a.sinif===s);const b=document.createElement('button');b.type='button';b.className='tile';
      b.innerHTML=`<b>${s}. sınıf</b><span>${[...new Set(arr.map(a=>a.ders))].sort(byDers).map(esc).join(' · ')}</span>`;
      b.onclick=()=>go(s);g.appendChild(b)}
    L.appendChild(g);return;
  }
  const back=document.createElement('button');back.type='button';back.className='back';back.textContent='← Tüm sınıflar';back.onclick=()=>go(null);
  const h=document.createElement('h2');h.textContent=st.sinif+'. sınıf';L.append(back,h);
  const inG=items.filter(a=>a.sinif===st.sinif&&(!st.ders||a.ders===st.ders));
  for(const d of [...new Set(inG.map(a=>a.ders))].sort(byDers)){
    const h3=document.createElement('h3');h3.textContent=d;L.append(h3,list(inG.filter(a=>a.ders===d).sort(byItem),false));
  }
}
function update(){
  $('clr').hidden=!st.q;
  const u=new URLSearchParams();if(st.q)u.set('q',st.q);else if(st.sinif){u.set('sinif',st.sinif);if(st.ders)u.set('ders',slug(st.ders))}
  try{history.replaceState(null,'',base+(u.toString()?'?'+u:''))}catch(e){}
  render();
}
function copy(text,btn){
  const old=btn.textContent;
  const done=ok=>{btn.textContent=ok?'Kopyalandı ✓':'Kopyalanamadı';btn.classList.toggle('done',ok);setTimeout(()=>{btn.textContent=old;btn.classList.remove('done')},1600)};
  const fallback=()=>{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}t.remove();if(!ok)window.prompt?.('Linki kopyala:',text);done(ok)};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>done(true),fallback);else fallback();
}
let tm;qEl.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{st.q=qEl.value.trim();update()},120)});
qEl.addEventListener('keydown',e=>{if(e.key==='Escape'){qEl.value='';st.q='';update()}});
$('clr').onclick=()=>{qEl.value='';st.q='';update();qEl.focus()};
update();
})();
</script>
<script data-goatcounter="https://yedogan-aplets.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body></html>
